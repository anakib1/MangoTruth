[tool:pytest]
# Test discovery
testpaths = detectors/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=detectors
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --doctest-modules
    --dist=worksteal
    --numprocesses=auto

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (>1s)
    gpu: Tests that require GPU
    external: Tests that require external services
    training: Training-related tests
    evaluation: Evaluation-related tests
    preprocessing: Data preprocessing tests
    factory: Factory pattern tests
    config: Configuration tests

# Test timeouts
timeout = 300

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:transformers.*
    ignore::UserWarning:torch.*

# Minimum version
minversion = 7.0

# Test collection (comma-separated list)
collect_ignore = setup.py,conftest.py 